<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Score Board</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <style>
      body {
        background-color: rgb(31, 31, 31);
        color: aliceblue;
      }
      h1 {
        margin: 40px;
        color: aliceblue;
        text-align: center;
      }

      .scoreShow{
        background-color: bisque;
        background-image: url(https://images.unsplash.com/photo-1579792727435-27b17f6ae234?q=80&w=2340&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D);
        backdrop-filter: blur(20px);
        color: black;
        padding: 40px;
      }

      .fst-col{
        background-color: #e1ffbf44;
        border-right: 3px solid black ;
        padding: 20px;
        border-top-left-radius: 20px;
        border-bottom-left-radius: 20px;
      }

      .score-display{
        font-size: 1.5em;
      }

      .controler {
        padding: 40px;
        font-size: 1.5em;
        background-color: #e1ffbf44;
        border-top-right-radius: 20px;
        border-bottom-right-radius: 20px;
      }

      .run-score{
       margin-bottom: 10px;
      }
      button:hover{
        background-color: rgb(240, 225, 174);
        transition: ;
      }

      .reset{
        padding: 30px;
        text-align: center;
      }

      .reset button{
        padding: 5px 25px;
      }
    </style>
  </head>
  <body>
    <h1>Cricket Score Board</h1>
    <div class="container scoreShow">
      <div class="row">
        <div class="col-6 fst-col">
            <div class="row">
            <div class="col-6 score-display" >INDIA <br>VS <br>PAKISTAN</div>
            <div class="col-6 score-display" >
                <p> IND: <span id="score-display">0</span> - <span id="wicket-display">0</span></p>
                <p>Over: <span id="over-display">0.0</span></p>
            </div>
            </div>
        </div>
        <div class="col-6 controler">
            <div class="run-score">
                <span>Run incriment: </span>
                <button onclick="runIncriment1()">+1</button>
                <button onclick="runIncriment2()">+2</button>
                <button onclick="runIncriment4()">+4</button>
                <button onclick="runIncriment6()">+6</button>
                <span> Out </span>
                <button onclick="out()">Out</button>

            </div>
            <div class="overcount">
                <span>Ball Count</span>
                <button onclick="ballcount()">+1</button>
            </div>
        
        </div>
      </div>
      <div class="reset">
      <button onclick="reset()">Reset</button>
      </div>

    </div>
    <script src="index.js"></script>
  </body>
</html>
